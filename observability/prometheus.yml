global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Phase-7 alert rules (observability/rules/alerts.yml, mounted at /etc/prometheus/
# rules). Non-recursive glob, so the promtool test fixture under rules/tests/ is
# NOT loaded as a rule file. The batch stages aren't scraped live (they exit
# before a scrape), so these rules load and validate but fire only under the
# deferred live-push path (BACKLOG); they are proven by `make test-alerts`.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  # Pipeline stages (producer_, resolve_, engine_, reconcile_, agent_)
  # are added as they gain /metrics endpoints in later phases.
