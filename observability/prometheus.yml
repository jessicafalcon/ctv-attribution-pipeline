global:
  scrape_interval: 15s
  evaluation_interval: 15s # evaluate alert rules promptly (Phase 18b live path), not the 1m default

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Phase-7 alert rules (observability/rules/alerts.yml, mounted at /etc/prometheus/
# rules). Non-recursive glob, so the promtool test fixture under rules/tests/ is
# NOT loaded as a rule file. Since Phase 18b the batch stages PUSH their terminal
# registry to the Pushgateway (scraped below), so these rules evaluate on live data;
# they are also proven deterministically by `make test-alerts`.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  # Pipeline stages (producer_, engine_ + resolve_, reconcile_, clickhouse_) are
  # finite drains that exit before a pull-scrape, so since Phase 18b they PUSH their
  # terminal registry to the Pushgateway and Prometheus scrapes THAT. honor_labels
  # keeps the job/instance labels each stage pushed, so a rule sees e.g.
  # reconcile_restatement_roas_abs_delta as the stage set it, not relabelled to
  # job="pushgateway".
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
