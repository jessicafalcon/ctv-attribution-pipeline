# Attribution-integrity alert rules (Phase 7, + one storage rule Phase 18a). Five
# deterministic conditions over the pipeline's own metrics; each of the first four is
# triggerable by a producer knob and proven by promtool against REAL captured values
# (observability/rules/tests/alerts_test.yml, baked by
# observability/gen_alert_fixtures.py from the make metrics-capture .prom dumps — see
# specs/phase-7.md). PartCountHigh is the documented exception, below.
#
# Thresholds sit between the clean profile (tiny) and the knobbed one
# (long_delay), both real captured runs (recaptured Phase 16):
#   ConsumerLag           backlog   62  → 129   (> 100)
#   WatermarkStall        lag_s   10367 → 17931 (> 14400 = 4h)
#   MatchRateOutOfBand    rate    0.854 → 0.696 (outside [0.80, 0.98])
#   RestatementMagnitude  Δroas   12.86 → 41.42 (> 1.0)
# RestatementMagnitude fires on tiny too, BY DESIGN since Phase 16: tiny's 5
# shared-IP conversions are deferred hot and credited by the reconcile pass, a
# real ROAS restatement. The other three stay silent on tiny (DECISIONS Phase 16;
# the MatchRate floor now clears by 0.054 — kept, revisit at the Phase-18
# recapture).
#
# PartCountHigh (Phase 18a) does NOT follow the between-two-profiles pattern, and the
# reason is recorded rather than hidden. Its threshold is ClickHouse's OWN
# parts_to_delay_insert default (150) — the point where the server starts throttling
# inserts — not a number chosen between two of our captures, because none exists: the
# real captures peak at 4 active parts on tiny and 5 on long_delay, two orders of
# magnitude below the threshold (part count here follows insert batching and merge
# timing, not event volume). So its SILENCE is
# proven by both real captures and its FIRING by a synthetic promtool input
# (observability/rules/tests/alerts_synthetic_test.yml, active_parts=151) — the file
# name says synthetic. A merge-lag rule is deliberately NOT shipped: every settled
# capture reads clickhouse_merge_backlog_seconds = 0, so there is nothing real to fire
# it. The metric ships anyway — measuring without alerting is true, alerting without a
# fireable measurement is not (BACKLOG; DECISIONS Phase 18a).
#
# The live push path is BUILT (Phase 18b): each batch stage pushes its terminal
# registry to the Pushgateway, Prometheus scrapes it after the stage exits, and these
# rules evaluate on live data — RestatementMagnitude is proven ACTIVE in Prometheus
# from a pushed reconcile metric, and Alertmanager routes firing → agent/webhook.py
# (tests/integration/test_live_firing.py). The `for: 5m` → firing → Alertmanager hop is
# proven deterministically by `make test-alerts` (eval_time), not re-timed on a wall
# clock (DECISIONS Phase 18b, amendment 2). The Phase-7 four carry no annotations, by
# design — a deliberate scope choice, not a deferral. Each rule's meaning is in the
# comment above it. Batch-mode honesty (DECISIONS Phase 7): ConsumerLag is a
# backlog proxy, not live consumer-group lag; WatermarkStall is a peak
# event→ingest lateness proxy, not a true watermark-advance stall.
groups:
  - name: attribution-integrity
    rules:
      # Consumer started too far behind the topic (batch consumer-lag proxy).
      - alert: ConsumerLag
        expr: resolve_input_backlog > 100
        for: 5m
        labels:
          severity: warning

      # Peak arrival lateness past 4h — conversions risk aging out of the hot
      # window into state-misses (watermark-stall proxy).
      - alert: WatermarkStall
        expr: engine_watermark_lag_seconds > 14400
        for: 5m
        labels:
          severity: warning

      # Hot match rate outside [0.80, 0.98] — too many unattributed (state-misses
      # / shared-IP noise) below, implausibly high (over-credit) above.
      - alert: MatchRateOutOfBand
        expr: >-
          (engine_conversions_attributed_total / engine_conversions_processed_total < 0.80)
          or
          (engine_conversions_attributed_total / engine_conversions_processed_total > 0.98)
        for: 5m
        labels:
          severity: warning

      # Reconciliation restated a campaign ROAS by more than 1.0 after advertisers
      # may have acted on the pre-reconciliation number.
      - alert: RestatementMagnitude
        expr: reconcile_restatement_roas_abs_delta > 1.0
        for: 5m
        labels:
          severity: warning

      # A table is approaching the point where ClickHouse throttles its inserts.
      # Un-merged parts are the operating cost of FINAL (RUNBOOK incident #1): a
      # FINAL scan physically reads every version-part before collapsing it, and
      # past parts_to_delay_insert the server slows writers down on purpose.
      - alert: PartCountHigh
        expr: clickhouse_active_parts > 150
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ $labels.table }} has {{ $value }} active parts — ClickHouse delays
            inserts from 150 (parts_to_delay_insert) and rejects them at 300
            (parts_to_throw_insert). Threshold is the SERVER's default, not a
            number measured between our profiles: real captures peak at 5 parts
            (see alerts_test.yml). Check background merges before writing more.
