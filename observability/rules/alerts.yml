# Attribution-integrity alert rules (Phase 7). Four deterministic conditions
# over the pipeline's own metrics; each is triggerable by a producer knob and
# proven by promtool against REAL captured values (observability/rules/tests/
# alerts_test.yml, generated by make metrics-capture — see specs/phase-7.md).
#
# Thresholds sit between a non-firing profile (tiny) and a firing one
# (long_delay), both real captured runs:
#   ConsumerLag           backlog   62  → 129   (> 100)
#   WatermarkStall        lag_s   10367 → 17931 (> 14400 = 4h)
#   MatchRateOutOfBand    rate    0.945 → 0.722 (outside [0.80, 0.98])
#   RestatementMagnitude  Δroas     0.0 → 27.03 (> 1.0)
#
# No annotations yet: they only surface in an Alertmanager notification, and live
# firing (a real scrape → notification) is the deferred push path (BACKLOG). Here
# the rules are proven and the live-scrape hop is simulated; annotations (with
# {{ $value }} rendering) land with that live path. Each rule's meaning is in the
# comment above it. Batch-mode honesty (DECISIONS Phase 7): ConsumerLag is a
# backlog proxy, not live consumer-group lag; WatermarkStall is a peak
# event→ingest lateness proxy, not a true watermark-advance stall.
groups:
  - name: attribution-integrity
    rules:
      # Consumer started too far behind the topic (batch consumer-lag proxy).
      - alert: ConsumerLag
        expr: resolve_input_backlog > 100
        for: 5m
        labels:
          severity: warning

      # Peak arrival lateness past 4h — conversions risk aging out of the hot
      # window into state-misses (watermark-stall proxy).
      - alert: WatermarkStall
        expr: engine_watermark_lag_seconds > 14400
        for: 5m
        labels:
          severity: warning

      # Hot match rate outside [0.80, 0.98] — too many unattributed (state-misses
      # / shared-IP noise) below, implausibly high (over-credit) above.
      - alert: MatchRateOutOfBand
        expr: >-
          (engine_conversions_attributed_total / engine_conversions_processed_total < 0.80)
          or
          (engine_conversions_attributed_total / engine_conversions_processed_total > 0.98)
        for: 5m
        labels:
          severity: warning

      # Reconciliation restated a campaign ROAS by more than 1.0 after advertisers
      # may have acted on the pre-reconciliation number.
      - alert: RestatementMagnitude
        expr: reconcile_restatement_roas_abs_delta > 1.0
        for: 5m
        labels:
          severity: warning
