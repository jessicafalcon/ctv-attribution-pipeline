services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6@sha256:04baa40ed34edf86028396f762be802f3b6b0acaab65e9de696a3f15d54c550f
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "127.0.0.1:19092:19092" # Kafka API for host clients
      - "127.0.0.1:18081:18081" # schema registry for host clients
      - "127.0.0.1:9644:9644"   # admin API for host-side rpk/debugging; Prometheus scrapes via compose DNS (redpanda:9644)
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      # -w -e exits 0 the moment the cluster reports healthy; if unhealthy it
      # blocks until the 3s timeout kills it (fail). Exit-code based — no
      # dependence on rpk's text output format.
      test: ["CMD", "rpk", "cluster", "health", "-w", "-e"]
      interval: 5s
      timeout: 3s
      retries: 24

  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b
    ports:
      - "127.0.0.1:8123:8123" # HTTP interface (clickhouse-connect uses this)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Re-enable network access for the passwordless default user (loopback-only
      # in recent images); host port is 127.0.0.1-bound. See the file's comment.
      - ./clickhouse/users.d/allow-network.xml:/etc/clickhouse-server/users.d/allow-network.xml:ro
      # The agent's SELECT-only principal (Phase-9 Ruling D); reconstructed from
      # source at container start, granted only SELECT on default.*.
      - ./clickhouse/users.d/agent-ro.xml:/etc/clickhouse-server/users.d/agent-ro.xml:ro
      # The metrics scraper's principal (Phase 18a): SELECT on system.parts /
      # system.merges plus SHOW TABLES on the five tables it counts — enough to see
      # their parts, not to read a row. agent_ro is unchanged.
      - ./clickhouse/users.d/metrics-ro.xml:/etc/clickhouse-server/users.d/metrics-ro.xml:ro
      # The cost writer's principal (Phase 18b): SELECT on system.query_log and
      # INSERT on default.query_cost_daily — its only two grants. A writer, so its
      # own principal, not a wider metrics_ro. Cannot read a pipeline row.
      - ./clickhouse/users.d/cost-rw.xml:/etc/clickhouse-server/users.d/cost-rw.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'select 1'"]
      interval: 5s
      timeout: 3s
      retries: 24

  # Pushgateway (Phase 18b): the batch stages are finite drains that exit before a
  # pull-scrape, so they PUSH their terminal registry here and the gateway PERSISTS it
  # for Prometheus to scrape. `make run` resets it per run. Loopback-bound + digest-pinned
  # like the other five services.
  pushgateway:
    image: prom/pushgateway:v1.11.1@sha256:03738d278e082ee9821df730c741b3b465c251fc2b68a85883def301a55a6215
    command:
      - --web.listen-address=:9091
      - --web.enable-admin-api # for the per-run wipe (make run reset); loopback-only
    ports:
      - "127.0.0.1:9091:9091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 24

  prometheus:
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 24

  alertmanager:
    image: prom/alertmanager:v0.28.0@sha256:d5155cfac40a6d9250ffc97c19db2c5e190c7bc57c6b67125c94903358f8c7d8
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    # Phase 18b: reach the host-run agent webhook (agent/webhook.py) from inside the
    # container. host.docker.internal resolves natively on Docker Desktop; host-gateway
    # makes it resolve on Linux CI too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 24

  grafana:
    image: grafana/grafana:11.4.0@sha256:d8ea37798ccc41061a62ab080f2676dda6bf7815558499f901bdb0f533a456fb
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin # local dev only; all ports bind 127.0.0.1
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  redpanda-data:
  alertmanager-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
