services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "127.0.0.1:19092:19092" # Kafka API for host clients
      - "127.0.0.1:18081:18081" # schema registry for host clients
      - "127.0.0.1:9644:9644"   # admin API for host-side rpk/debugging; Prometheus scrapes via compose DNS (redpanda:9644)
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      # -w -e exits 0 the moment the cluster reports healthy; if unhealthy it
      # blocks until the 3s timeout kills it (fail). Exit-code based — no
      # dependence on rpk's text output format.
      test: ["CMD", "rpk", "cluster", "health", "-w", "-e"]
      interval: 5s
      timeout: 3s
      retries: 24

  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39
    ports:
      - "127.0.0.1:8123:8123" # HTTP interface (clickhouse-connect uses this)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'select 1'"]
      interval: 5s
      timeout: 3s
      retries: 24

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 24

  alertmanager:
    image: prom/alertmanager:v0.28.0
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 24

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin # local dev only; all ports bind 127.0.0.1
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  redpanda-data:
  alertmanager-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
