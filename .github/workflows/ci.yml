name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5" # match local; bump deliberately
      # --locked: fail on a stale lock instead of silently re-resolving to
      # versions whose hashes nobody reviewed (security-review finding).
      - run: uv sync --locked
      - run: make lint
      - run: make test
  # Integration job (make up + seed + run + test-int) is added in Phase 3.
