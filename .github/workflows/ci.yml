name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.5" # match local; bump deliberately
      # --locked: fail on a stale lock instead of silently re-resolving to
      # versions whose hashes nobody reviewed (security-review finding).
      - run: uv sync --locked
      # DuckDB iceberg extension is fetched once here (network allowed at setup),
      # so `make test`'s offline unit suite only LOADs it — never fetches. The one
      # Phase-12 dependency not hash-pinned in uv.lock (signed, duckdb-version-tied;
      # DECISIONS Phase 12).
      - run: uv run python -m lake.install_extension
      - run: make lint
      - run: make check-docs
      - run: make test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.5" # match local; bump deliberately
      - run: uv sync --locked
      # Phase 17: every row reaches ClickHouse through the lake (engine → Iceberg →
      # Dagster load → ClickHouse), so the integration job needs the DuckDB iceberg
      # extension too (same one-time fetch as the offline job; DECISIONS Phase 12).
      - run: uv run python -m lake.install_extension
      # Hot path against the compose stack: seed → engine (resolve in-process) →
      # lake → load → ClickHouse, then the tiny integration suite (FINAL-state +
      # idempotency). `run-hot`, not `run`: the tiny golden + pinned accuracy are
      # hot-path oracles, and a reconciliation pass would over-credit tiny's
      # long-tail organics and shift them. Runtime grows with the lake hop
      # (Dagster + DuckDB) — accepted (spec D5).
      - run: make up
      # Alert-rule guard (offline w.r.t. the stack — needs only the digest-pinned
      # prometheus image, already pulled by `make up`): promtool check rules +
      # test rules assert the four alerts still fire on long_delay's real captured
      # values and that on tiny only RestatementMagnitude fires (Phase-16 deferral
      # landing). This is what catches a metric rename or rule edit silently
      # breaking the fixture — the guard that keeps Gate 2 honest.
      - run: make test-alerts
      # Clean lake, not just a clean stack (Phase 17): ClickHouse is loaded from
      # the lake, which outlives `make down`. A fresh runner has no lake, so this is
      # a no-op here — it is the documented clean-state step, kept so the CI chain
      # equals the spec's DONE command and the canonical demos.
      - run: make lake-reset CONFIRM=yes
      - run: make seed PROFILE=tiny
      - run: make run-hot
      - run: make test-int
      # Reconciliation coverage: its rollup/restatement/RMT-supersession logic is
      # live-only (no offline oracle), so it must run in CI. Its own clean
      # long_delay stack (the target does down && lake-reset && up && seed && run), which tiny
      # can't substitute — tiny's 3 state-misses have no exposure inside 90d and
      # its 5 shared-IP deferrals (Phase 16) are in-window, so a long-window pass
      # recovers no state-miss there. Costs a second stack cycle.
      - run: make test-int-long-delay
      # Benchmark equality guard: test-int-long-delay above leaves a populated
      # campaign_hourly on a long_delay stack, so `make bench` runs for free here
      # and asserts the optimized rollup still returns the same metric rows as the
      # naive scan — catching a refresh-semantics drift. NOTE: equality is verified
      # on long_delay's data specifically, not proven structurally for all profiles
      # (BACKLOG: verify before reusing bench on another profile, e.g. Phase-8
      # shared-IP). Latency in CI is noise; the equality assertion is the guard.
      - run: make bench
      - if: always()
        run: make down
