name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5" # match local; bump deliberately
      # --locked: fail on a stale lock instead of silently re-resolving to
      # versions whose hashes nobody reviewed (security-review finding).
      - run: uv sync --locked
      - run: make lint
      - run: make test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5" # match local; bump deliberately
      - run: uv sync --locked
      # Full pipeline against the compose stack: seed → resolve → engine →
      # ClickHouse, then the integration suite (FINAL-state + idempotency).
      - run: make up
      - run: make seed PROFILE=tiny
      - run: make run
      - run: make test-int
      - if: always()
        run: make down
