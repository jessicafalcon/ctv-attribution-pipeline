name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.5" # match local; bump deliberately
      # --locked: fail on a stale lock instead of silently re-resolving to
      # versions whose hashes nobody reviewed (security-review finding).
      - run: uv sync --locked
      - run: make lint
      - run: make test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.5" # match local; bump deliberately
      - run: uv sync --locked
      # Hot path against the compose stack: seed → resolve → engine → ClickHouse,
      # then the tiny integration suite (FINAL-state + idempotency). `run-hot`,
      # not `run`: the tiny golden + pinned accuracy are hot-path oracles, and a
      # reconciliation pass would over-credit tiny's long-tail organics and shift
      # them.
      - run: make up
      - run: make seed PROFILE=tiny
      - run: make run-hot
      - run: make test-int
      # Reconciliation coverage: its rollup/restatement/RMT-supersession logic is
      # live-only (no offline oracle), so it must run in CI. Its own clean
      # long_delay stack (the target does down && up && seed && run), which tiny
      # can't substitute — tiny has no caused hot-misses, so it can't test
      # recovery at all. Costs a second stack cycle.
      - run: make test-int-long-delay
      - if: always()
        run: make down
