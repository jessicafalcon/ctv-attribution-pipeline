[project]
name = "ctv-attribution-pipeline"
version = "0.1.0"
description = "Streaming CTV attribution pipeline with an AI measurement-integrity agent"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff==0.16.3", # keep in lockstep with .pre-commit-config.yaml rev
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
