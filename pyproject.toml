[project]
name = "ctv-attribution-pipeline"
version = "0.1.0"
description = "Streaming CTV attribution pipeline with an AI measurement-integrity agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.125.0",
    "bytewax>=0.21.1",
    "clickhouse-connect>=1.7.1",
    "confluent-kafka>=2.15.0",
    "dagster>=1.13.18",
    "dagster-webserver>=1.13.18",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "prometheus-client>=0.21",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pyiceberg[pyiceberg-core,sql]>=0.11.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff==0.16.3", # keep in lockstep with .pre-commit-config.yaml rev
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
